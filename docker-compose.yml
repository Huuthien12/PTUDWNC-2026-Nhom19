services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: CulinaryBlogDb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data

  minio:
    image: quay.io/minio/minio:latest
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data

  mailhog:
    image: mailhog/mailhog
    ports:
      - "${MAILHOG_SMTP_PORT:-1025}:1025"
      - "${MAILHOG_UI_PORT:-8025}:8025"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.119.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector-config.yml:/etc/otelcol/config.yaml:ro
    ports:
      - "${OTLP_GRPC_PORT:-4317}:4317"
      - "${OTLP_HTTP_PORT:-4318}:4318"

  api:
    build:
      context: .
      dockerfile: backend/CulinaryBlog.API/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=CulinaryBlogDb;Username=postgres;Password=${POSTGRES_PASSWORD}
      ConnectionStrings__Redis: redis:6379
      Jwt__Key: ${JWT_KEY}
      Minio__Endpoint: minio:9000
      Minio__AccessKey: ${MINIO_ROOT_USER}
      Minio__SecretKey: ${MINIO_ROOT_PASSWORD}
      Minio__PublicBaseUrl: ${MINIO_PUBLIC_BASE_URL:-http://localhost:9000}
      Email__Smtp__Host: mailhog
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      ForwardedHeaders__KnownProxy: 172.28.0.250
    depends_on:
      postgres: { condition: service_started }
      redis: { condition: service_started }
      minio: { condition: service_started }
      otel-collector: { condition: service_started }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 10

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ""
    environment:
      API_URL: http://api:8080
      NEXT_PUBLIC_API_URL: ${BROWSER_API_URL:-http://localhost:5062}
    depends_on:
      api: { condition: service_healthy }

  nginx:
    image: nginx:1.27-alpine
    ports: ["${PROXY_PORT:-3000}:80"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      frontend: { condition: service_started }
      api: { condition: service_healthy }
    networks:
      default:
        ipv4_address: 172.28.0.250
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health/live >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:
  miniodata:

networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/16
