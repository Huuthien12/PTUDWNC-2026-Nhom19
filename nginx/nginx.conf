events {}

http {
  upstream frontend_upstream { server frontend:3000; }
  upstream api_upstream { server api:8080; }

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  server {
    listen 80;
    server_name _;
    client_max_body_size 5184k;
    error_page 413 = @request_too_large;

    location @request_too_large {
      default_type application/problem+json;
      return 413 '{"type":"REQUEST_TOO_LARGE","title":"Request body too large.","status":413}';
    }

    location /api/ {
      proxy_pass http://api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $host;
    }

    location = /health { proxy_pass http://api_upstream; }
    location = /health/live { proxy_pass http://api_upstream; }
    location = /health/ready { proxy_pass http://api_upstream; }

    location / {
      proxy_pass http://frontend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }
}
